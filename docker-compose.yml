name: nakime
services:

  # ── Volt Security Backend (Python FastAPI) ──────────────────────────────────
  # Provides Wazuh, Suricata, ntopng, Splunk, employee, and health APIs.
  # Set USE_SAMPLE_DATA=true to run with demo data (no real tools required).
  # Set USE_SAMPLE_DATA=false and configure tools in volt-server/.env for prod.
  volt-server:
    build:
      context: ./volt-server
      dockerfile: Dockerfile
    container_name: volt-server
    ports:
      - "8000:8000"
    env_file:
      - path: ./volt-server/.env
        required: false
    environment:
      - USE_SAMPLE_DATA=true          # flip to false when real tools are ready
      # Uncomment and fill in when connecting real tools:
      # - WAZUH_URL=https://your-wazuh:55000
      # - WAZUH_USER=wazuh-wui
      # - WAZUH_PASS=changeme
      # - NTOPNG_URL=http://your-ntopng:3000
      # - SURICATA_EVE_PATH=/var/log/suricata/eve.json
    # If Suricata is installed on this host, uncomment to stream live alerts:
    # volumes:
    #   - /var/log/suricata/eve.json:/var/log/suricata/eve.json:ro
    restart: unless-stopped
    networks:
      - nakime_net

  # ── Nakime Web UI (Next.js) ─────────────────────────────────────────────────
  nakime:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nakime
    ports:
      - "${NAKIME_PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_OPTIONS=--dns-result-order=ipv4first
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - VOLT_SERVER_URL=http://volt-server:8000
    depends_on:
      - volt-server
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - nakime_net

networks:
  nakime_net:
    driver: bridge

# ── CasaOS app-store metadata (ignored by plain Docker Compose) ──
x-casaos:
  architectures:
    - amd64
    - arm64
  main: nakime
  author: dhruvagrawat
  developer: dhruvagrawat
  category: Network
  description:
    en_us: >-
      NAKIME is an enterprise-grade open-source OSINT and cybersecurity
      situational-awareness platform. The Volt branch adds Wazuh SIEM,
      Suricata IDS, ntopng traffic analysis, employee tracking, and system
      health dashboards on top of the global intelligence map.
  tagline:
    en_us: Global intelligence + enterprise cybersecurity platform
  title:
    en_us: NAKIME
  icon: https://raw.githubusercontent.com/dhruvagrawat/nakime/master/public/casaos-icon.png
  thumbnail: https://raw.githubusercontent.com/dhruvagrawat/nakime/master/public/og-image.png
  scheme: http
  hostname: ""
  port_map: "3000"
  index: /
  webui_port: 3000
  envs:
    - container: SCANNER_URL
      description:
        en_us: "(Optional) RECON scanner backend URL"
    - container: SCANNER_KEY
      description:
        en_us: "(Optional) RECON scanner shared secret"
    - container: FIRMS_API_KEY
      description:
        en_us: "(Optional) NASA FIRMS API key for active-fire data"
    - container: AIS_API_KEY
      description:
        en_us: "(Optional) aisstream.io key for maritime vessel tracking"
    - container: GEMINI_API_KEY
      description:
        en_us: "(Optional) Google Gemini key for AI analyst"
  ports:
    - container: "3000"
      description:
        en_us: "Nakime Web UI (HTTP)"
    - container: "8000"
      description:
        en_us: "Volt Security Backend API"
